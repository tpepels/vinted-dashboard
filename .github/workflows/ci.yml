name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: bash -n scripts/upgrade.sh
      - run: python -m app.ops --help
      - run: python -m app.runtime_config
      - run: python scripts/hosted_smoke.py --help
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: node --check app/product_static/app.js
      - run: node --check app/extension/background.js
      - run: node --check app/extension/content.js
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:////tmp/vinted-dashboard-ci.sqlite3
      - run: python scripts/build_extension.py --mode store --api-origin https://example.invalid --version 2.0.0 --output /tmp/chrome-bridge.zip
      - run: docker build -t vinted-dashboard:test .
