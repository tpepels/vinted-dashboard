name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # compare the actual pre-redesign renderer in the UX evidence test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: bash -n scripts/upgrade.sh
      - run: python -m app.ops --help
      - run: python -m app.runtime_config
      - run: python scripts/hosted_smoke.py --help
      - run: |
          export APP_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python scripts/release_readiness.py --json --max-restore-drill-age-days 36500
        env:
          APP_ENV: production
          PUBLIC_APP_URL: https://example.invalid
          PRIVACY_CONTACT_EMAIL: privacy@example.invalid
          COOKIE_SECURE: "true"

          DATABASE_URL: postgresql+psycopg2://user:pass@example.invalid/db
          EXTENSION_LATEST_VERSION: 3.4.1
          BACKUP_PROVIDER: ci-managed-snapshot
          BACKUP_RESTORE_DRILL_AT: 2026-10-01
      - run: python -m pytest -q
      - run: node --check app/product_static/app.js
      - run: node scripts/test_connections_ui.js
      - run: node scripts/test_connection_health_ui.js
      - run: node scripts/test_biblio_connections_ui.js
      - run: node scripts/test_marketplace_operations_ui.js
      - run: node scripts/test_table_ui.js
      - run: node scripts/test_responsive_tables_visual.js
      - run: node scripts/test_store_stock_audit_ui.js
      - run: node scripts/test_marketplace_price_ui.js
      - run: node scripts/test_marketplace_content_ui.js
      - run: node scripts/test_marketplace_close_ui.js
      - run: node scripts/test_shopify_close_ui.js
      - run: node scripts/test_marketplace_ui_evidence.js
      - run: node scripts/test_marketplace_visual_layout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-ui-before-after
          path: |
            ui-evidence/*.html
            ui-evidence/*.json
            ui-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
      - run: node --check app/extension/background.js
      - run: node --check app/extension/vinted_age.js
      - run: node --check app/extension/content.js
      - run: node scripts/test_vinted_page_age.js
      - run: node scripts/test_vinted_content_idempotent.js
      - run: node scripts/test_vinted_rendered_tab_age.js
      - run: node scripts/test_vinted_age_sweep.js
      - run: node scripts/test_vinted_site_rate_limit.js
      - run: node scripts/test_vinted_rate_safe_sync.js
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:////tmp/vinted-dashboard-ci.sqlite3
      - run: python scripts/build_extension.py --mode store --api-origin https://example.invalid --version 3.4.1 --output /tmp/chrome-bridge.zip
      - run: docker build -t vinted-dashboard:test .
