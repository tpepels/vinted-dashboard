<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vinted Dashboard Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand"><span>V</span><div><strong>Vinted Dashboard</strong><small>Chrome Sync</small></div></div>
    <p>Keeps <code>media-server:5050</code> updated from your signed-in Vinted tab.</p>
    <div id="status" class="status">Checking…</div>
    <button id="sync" class="primary">Sync now</button>
    <div class="buttons">
      <button id="dashboard">Open dashboard</button>
      <button id="vinted">Open Vinted</button>
    </div>
    <small class="note">No Vinted cookie values are exported. The extension reads Vinted data inside the signed-in tab and sends only dashboard data to your local server.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
